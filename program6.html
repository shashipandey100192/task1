<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h1 style="color:red;background-color: orange;font-size: 40px;">heading one</h1>

<h2>heading two</h2>


<script>
    var jsh = document.querySelectorAll("h1,h2");
    jsh[1].addEventListener("click",()=>{
        jsh[1].style.color="red";
        jsh[1].style.backgroundColor="orange";
        jsh[1].style.fontSize="40px";
    });
    





</script>
    
</body>
</html>
