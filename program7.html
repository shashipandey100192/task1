<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div
        {
            border:1px solid red;
            margin-top:10px;
            padding:20px;

        }

        .first
        {
            background-color: blue;
            color:white;
            text-align: center;
        }
        .second
        {
            font-size: 30px;
            text-transform: uppercase;
        }

        .third
        {
            border-radius: 20px;
        }
        .fourth
        {
            box-shadow: 3px 5px 5px black;
        }

    </style>
</head>
<body>

<div>this is my box 1</div>
<div>this is my box 2</div>
<div>this is my box 3</div>
<div>this is my box 4</div>
<div>this is my box 5</div>


<script>

var a = document.querySelectorAll("div");
console.log(a);

a[0].addEventListener("click",()=>{
    a[0].style.backgroundColor='red';
});

a[1].addEventListener("click",()=>{
    a[1].className="first";
});

a[2].addEventListener("click",()=>{
    a[2].classList.add("first","second","third","fourth");
});


a[3].addEventListener("dblclick",()=>{
    a[2].classList.remove("third","second");
});

a[4].addEventListener("click",()=>{
    a[4].classList.toggle("first");
});






</script>

    
</body>
</html>
