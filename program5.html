<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>heading one</h1>
    <h6>this is heading heading two</h6>
    <input type="text">


    <input type="button" value="start task">


    <script>

        var jsinput = document.querySelectorAll("input");
        jsinput[0].addEventListener("click", () => {
            jsinput[0].setAttribute("title", "username");
            jsinput[0].setAttribute("size", 50);
            if (jsinput[0].value == "disabled") {
                jsinput[0].setAttribute("disabled", "disabled");
            }
        })

        jsinput[0].addEventListener("input",()=>{
            if(jsinput[0].value=="type")
        {
            jsinput[0].removeAttribute("type");
        }
        else if(jsinput[0].value=="remove")
        {
            jsinput[0].remove();
        }
        })


        var a = 1;
        jsinput[1].addEventListener("click",()=>{
            jsinput[1].value="start task"+a;
            a++;
            if(a>=4)
        {
            jsinput[1].setAttribute("disabled","disabled");
        }
        })

    </script>

</body>

</html>
