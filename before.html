<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            margin:0 auto;
            padding:0;
        }

        ul{
            list-style-type: none;
        }
        ul li::before
        {
            content: "\2714";
            color:red;
            margin-right: 10px;
        }
        ul li::after
        {
            content: "-------------------------------------------------- \2754";
        }

        .first
        {
            width:300px;
            height: 100px;
            background-color: orangered;
            padding:20px;
            box-sizing: border-box;
           display: none;
            border-radius: 20px;
        }
        .first::before{
            content: "";
            width:0px;
            height: 0px;
            border-left: 0px solid green;
            border-right: 20px solid orangered;;
            border-top:20px solid transparent;
            border-bottom: 20px solid transparent;
            position: absolute;
            margin:0 0 0 -30px;
        }
        .box
        {
            width: 1200px;
            height: auto;
            border:1px solid red;
            display: grid;
            margin:0 auto;
            padding:0;
            grid-template-columns: 400px 550px 250px;
            grid-template-rows: 300px 200px 300px auto;
         }
         .box section
         {
            border:1px solid blue;
            padding:10px;
            margin:5px;
         }
         .box section:nth-child(1)
         {
            grid-column-start: 1;
            grid-column-end: 3;
         }

         .box section:nth-child(6)
         {
            grid-column-start: 1;
            grid-column-end: 4;
            background-color: antiquewhite;
         }
         input:checked + .first{
            display: inline-block;
         }
    </style>
</head>
<body>




    <ul>
        <li>home page</li>
        <li>home page</li>
        <li>home page</li>
        <li>home page</li>
    </ul>

<div class="box">
    <section>
        <h1>this is slider</h1>
    </section>
    <section>box2</section>
    <section>

       <input type="checkbox">
        <div class="first">sdfsdf   kdfjklsd jkl jsklddf jklsdj fjk hsdfjk hsjkdf hjk sdfhjksdh </div>

    </section>
    <section>box4</section>
    <section>box5</section>
    <section>box6</section>
    <section>box7</section>
    <section>box8</section>
</div>
    



</body>
</html>
